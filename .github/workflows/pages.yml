name: Déployer TopoGIS 3D sur GitHub Pages

# Déploiement automatique à chaque envoi sur la branche principale.
# Prérequis (une seule fois) : Settings > Pages > Source : « GitHub Actions ».
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (un seul fichier : index.html)
        run: |
          mkdir dist
          cp index.html dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
